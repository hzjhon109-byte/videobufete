<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
}

video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}
</style>
</head>

<body>

<video
    id="videoBufete"
    loop
    playsinline
    preload="auto"
    disablepictureinpicture
    controlslist="nodownload noplaybackrate noremoteplayback">

    <source src="video-bufete.mp4" type="video/mp4">

</video>

<script>
const video = document.getElementById("videoBufete");
let usuarioInteractuo = false;

/* PRIMER CLIC: habilita el audio */
document.addEventListener("click", () => {
    usuarioInteractuo = true;
    video.muted = false;
}, { once: true });

/* Detecta cuándo el video está visible */
const observer = new IntersectionObserver((entries) => {

    entries.forEach(entry => {

        if (entry.isIntersecting) {

            if (usuarioInteractuo) {
                video.muted = false;
                video.play().catch(() => {});
            } else {
                video.muted = true;
                video.play().catch(() => {});
            }

        } else {

            video.pause();

        }

    });

}, {
    threshold: 0.5
});

observer.observe(video);
</script>

</body>
</html>
