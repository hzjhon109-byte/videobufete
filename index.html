<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Video Bufete</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
}

#video-container {
    width: 100%;
    height: 100vh;
}

#player {
    width: 100%;
    height: 100%;
}
</style>
</head>

<body>

<div id="video-container">
    <div id="player"></div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
let player = null;
let listo = false;

const VIDEO_ID = "gxbsymFXoao";

function onYouTubeIframeAPIReady() {

    player = new YT.Player("player", {

        videoId: VIDEO_ID,

        playerVars: {
            autoplay: 0,
            controls: 1,
            rel: 0,
            playsinline: 1,
            loop: 1,
            playlist: VIDEO_ID
        },

        events: {
            onReady: function(event) {
                listo = true;
                event.target.unMute();
                event.target.setVolume(100);
            }
        }
    });
}

const observador = new IntersectionObserver(function(entries) {

    entries.forEach(function(entry) {

        if (!player || !listo) return;

        if (entry.isIntersecting) {

            player.unMute();
            player.setVolume(100);
            player.playVideo();

        } else {

            player.pauseVideo();

        }

    });

}, {
    threshold: 0.50
});

observador.observe(
    document.getElementById("video-container")
);
</script>

</body>
</html>
